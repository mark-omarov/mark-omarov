name: Profile

on:
  schedule:
    # just after midnight in Tokyo, when the banner moves to the next place
    - cron: '5 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/website/scripts/profile/**
      - services/website/src/art/**
      - services/website/src/data/site.ts
      - services/website/content/blog/**
      - services/website/package.json
      - .github/workflows/profile.yml
  pull_request:
    paths:
      - services/website/scripts/profile/**
      - services/website/src/art/**
      - services/website/src/data/site.ts
      - services/website/content/blog/**
      - services/website/package.json
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @workspace/website
      - run: pnpm --filter @workspace/website run draw-profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # through the API, so GitHub signs the commit: main only takes signed ones
      - name: Commit
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed=$(git status --porcelain --untracked-files=all .github/profile | cut -c4-)
          [ -z "$changed" ] && exit 0
          body="$RUNNER_TEMP/commit.json"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" --arg head "$(git rev-parse HEAD)" '{
            query: "mutation ($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
            variables: { input: {
              branch: { repositoryNameWithOwner: $repo, branchName: $branch },
              expectedHeadOid: $head,
              message: { headline: "Redraw the profile images" },
              fileChanges: { additions: [] }
            } }
          }' > "$body"
          for f in $changed; do
            base64 -w0 "$f" > "$RUNNER_TEMP/file.b64"
            jq --arg path "$f" --rawfile contents "$RUNNER_TEMP/file.b64" \
              '.variables.input.fileChanges.additions += [{ path: $path, contents: $contents }]' \
              "$body" > "$RUNNER_TEMP/next.json"
            mv "$RUNNER_TEMP/next.json" "$body"
          done
          gh api graphql --input "$body" --jq .data.createCommitOnBranch.commit.url
